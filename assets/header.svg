<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">Business Idea Stress Test</title>
<desc id="desc">Dark blue banner showing a business idea examined through customer research, market evidence, finance, and adversarial critique.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0A1630"/><stop offset="1" stop-color="#122D51"/></linearGradient>
 <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#FFF1B5"/><stop offset="1" stop-color="#F6AF38"/></linearGradient>
 <linearGradient id="card" x2="1" y2="1"><stop stop-color="#1D466F"/><stop offset="1" stop-color="#142E50"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="10"/></filter>
 <pattern id="dot" x="0" y="0" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#7DAACE" opacity=".11"/></pattern>
</defs>
<rect width="1200" height="320" rx="18" fill="url(#bg)"/><rect width="1200" height="320" rx="18" fill="url(#dot)"/>
<path d="M43 263H611" stroke="#365E81" stroke-width="2" opacity=".45"/>
<rect x="56" y="39" width="115" height="29" rx="14" fill="#173C50" stroke="#428D93"/><circle cx="74" cy="53.5" r="5" fill="#6BD6AA"/><text x="88" y="59" fill="#CCFAEA" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold">AGENT SKILL</text>
<text x="56" y="118" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="bold">Business Idea</text>
<text x="56" y="177" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="bold">Stress Test</text>
<text x="58" y="220" fill="#C8DAEE" font-family="Arial, Helvetica, sans-serif" font-size="19">Challenge assumptions. Verify evidence.</text>
<text x="58" y="247" fill="#C8DAEE" font-family="Arial, Helvetica, sans-serif" font-size="19">Invest in answers, not guesses.</text>
