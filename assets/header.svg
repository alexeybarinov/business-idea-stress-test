 <rect x="706" y="43" width="179" height="58" rx="12" fill="url(#card)" stroke="#5583AD"/><circle cx="730" cy="72" r="7" fill="#6DD5BB"/><text x="747" y="77">Customer insight</text>
 <rect x="1007" y="43" width="164" height="58" rx="12" fill="url(#card)" stroke="#5583AD"/><circle cx="1031" cy="72" r="7" fill="#6DD5BB"/><text x="1047" y="77">Market evidence</text>
 <rect x="708" y="214" width="167" height="58" rx="12" fill="url(#card)" stroke="#5583AD"/><circle cx="732" cy="243" r="7" fill="#6DD5BB"/><text x="749" y="248">Unit economics</text>
 <rect x="1007" y="214" width="164" height="58" rx="12" fill="url(#card)" stroke="#5583AD"/><circle cx="1031" cy="243" r="7" fill="#6DD5BB"/><text x="1047" y="248">Adversarial test</text>
