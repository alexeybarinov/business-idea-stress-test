<rect x="939" y="141" width="8" height="22" rx="1" fill="#142C51"/><rect x="950" y="130" width="8" height="33" rx="1" fill="#142C51"/><rect x="961" y="119" width="8" height="44" rx="1" fill="#142C51"/>
