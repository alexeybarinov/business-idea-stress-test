name: Publish versioned skill
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-skill
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'PyYAML>=6,<7'
      - name: Validate and build installable archive
        run: |
          python scripts/validate_skill.py
          python scripts/package_skill.py
      - name: Create immutable version tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION | tr -d '\r\n')"
          TAG="v${VERSION}"
          ZIP="dist/business-idea-stress-test-${TAG}.zip"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "Version tag ${TAG} already exists; will not overwrite its content"
            if ! gh release view "${TAG}" >/dev/null 2>&1; then
              echo "Tag exists without a release; a maintainer must review it before creating one"
              exit 1
            fi
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Business Idea Stress Test ${TAG}"
          git push origin "refs/tags/${TAG}"
          gh release create "${TAG}" "${ZIP}" \
            --title "Business Idea Stress Test ${TAG}" \
            --generate-notes --verify-tag
